*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}

.app{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.hd{display:flex;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 4px 18px}

.pill.alt{background:var(--field);color:var(--text)}
.ac{display:flex;gap:6px}

.tab{flex:1;display:grid;justify-items:center;gap:4px;color:var(--muted);font-size:13px}
.tab[data-k=chats]{--c:#2dd4bf}.tab[data-k=friends]{--c:#ff7ab8}.tab[data-k=comm]{--c:#a78bfa}.tab[data-k=profile]{--c:#fbbf24}
.tp{position:relative;width:64px;height:34px;border-radius:17px;display:grid;place-items:center}

.pane{flex:1;overflow:auto;padding:14px 16px;overscroll-behavior:contain;background:radial-gradient(circle at 85% 8%,rgba(139,92,246,.12),transparent 50%),radial-gradient(circle at 10% 92%,rgba(45,212,191,.1),transparent 50%)}

/* Sleek WhatsApp-style bubbles */
.b{max-width:82%;padding:6px 10px;border-radius:16px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.4;position:relative;touch-action:pan-y}

/* Inline floating timestamp */
.meta{float:right;display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin:6px -2px -4px 12px;position:relative;z-index:1}
.b.me .meta{color:rgba(255,255,255,.75)}

.day{text-align:center;margin:10px 0;color:var(--muted);font-size:12px}

/* Slimmer input panel */
.comp{display:flex;gap:8px;align-items:flex-end;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);width:100%}

.comp textarea{flex:1;resize:none;max-height:120px;padding:10px 12px;background:none;border:0;outline:0;min-width:0;min-height:40px;line-height:20px;font-size:15px;margin:0}
.comp .ib{width:38px;height:40px;flex:none;color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}

.hero{display:grid;justify-items:center;gap:10px;padding:20px 18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}.stats div{padding:12px 4px;border-radius:16px;background:var(--panel);text-align:center}.stats b{display:block;font-size:20px;font-weight:500}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:360px;display:grid;gap:10px}.card h1{text-align:center;margin:0 0 8px;font-size:32px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{padding:13px;border-radius:16px;background:var(--grad);color:#fff;width:100%}.btn.alt{background:var(--field);color:var(--text)}.link{color:var(--muted);text-decoration:underline}.tag{text-align:center;color:var(--muted);font-size:12px;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;align-items:end;justify-items:center;z-index:9}
.sheet{width:100%;max-width:560px;max-height:82dvh;display:flex;flex-direction:column;gap:8px;padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:var(--panel);overflow:auto}.sheet>b,.sheet>.field,.sheet>.pill,.sheet>.seg,.sheet>.opt,.sheet>small,.sheet>.btn{margin:0 18px;width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--field)}.seg button{padding:9px;border-radius:12px;color:var(--muted)}.seg button.on{background:var(--chip);color:var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.sw{width:48px;height:28px;border-radius:14px;background:var(--field);position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}.sw[aria-checked=true]{background:#22c6a8}.sw[aria-checked=true]::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;border-radius:99px;z-index:12;white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}

<script>
/* COSMIC CHAT — Phase 2: real Supabase authentication + profiles.
   Browser-safe publishable key only. Never place a service-role key in this file. */
(() => {
  'use strict';
  const SUPABASE_URL = 'https://kkygqxnwwtodjpimgovr.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_V0YcFCED6kMEAF8OXLrULw_kGqYh8Jn';
  if (!window.supabase || !window.supabase.createClient) {
    console.error('Supabase JS failed to load.');
    return;
  }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  let cosmicUser = null;
  let cosmicProfile = null;
  let profileSearchTimer = null;
  let finishingUserId = null;
  let finishPromise = null;

  const cleanUsername = value => String(value || '').trim().replace(/^@/, '').toLowerCase();
  const validUsername = value => /^[a-z][a-z0-9_]{2,19}$/.test(value);
  const authError = error => {
    const m = (error && error.message) || 'Something went wrong. Please try again.';
    if (/invalid login credentials/i.test(m)) return 'Email or password is incorrect.';
    if (/email not confirmed/i.test(m)) return 'Please verify your email before signing in.';
    if (/user already registered/i.test(m)) return 'An account with this email already exists. Sign in instead.';
    if (/duplicate key|unique constraint|profiles_username_lower_unique/i.test(m)) return 'That username is already taken. Choose another one.';
    if (/password should be at least/i.test(m)) return 'Use a password with at least 6 characters.';
    return m;
  };
  const setBusy = busy => {
    $('#go').disabled = !!busy;
    $('#google').disabled = !!busy;
    $('#go').textContent = busy ? 'Please wait…' : (mode === 'up' ? 'Create account' : 'Sign in');
  };
  const showAuthError = error => toast(authError(error));
  const redirectUrl = () => {
    const base = location.href.split('#')[0];
    return base + '#cosmicweb';
  };

  async function readProfile(user) {
    const { data, error } = await db.from('profiles')
      .select('id,display_name,username,bio,avatar_url,created_at')
      .eq('id', user.id).maybeSingle();
    if (error) throw error;
    return data;
  }

  async function ensureProfile(user) {
    const meta = user.user_metadata || {};
    let profile = await readProfile(user);
    const suggestedName = String(meta.display_name || meta.full_name || meta.name || user.email?.split('@')[0] || 'Cosmic user').slice(0,60);
    const suggestedUsername = cleanUsername(meta.username || '');
    if (!profile) {
      const payload = {
        id: user.id,
        display_name: suggestedName,
        username: validUsername(suggestedUsername) ? suggestedUsername : null,
        bio: ''
      };
      const { error } = await db.from('profiles').insert(payload);
      if (error && error.code !== '23505') throw error;
      profile = await readProfile(user);
    }
    if (!profile) throw new Error('Your profile could not be loaded. Please refresh and try again.');
    if (!profile.display_name) {
      const { error } = await db.from('profiles').update({ display_name: suggestedName }).eq('id', user.id);
      if (error) throw error;
      profile.display_name = suggestedName;
    }
    if (!profile.username && validUsername(suggestedUsername)) {
      const { error } = await db.from('profiles').update({ username: suggestedUsername }).eq('id', user.id);
      if (!error) profile.username = suggestedUsername;
      else if (error.code !== '23505') throw error;
    }
    cosmicUser = user;
    cosmicProfile = profile;
    P.name = profile.display_name || suggestedName;
    P.bio = profile.bio || '';
    P.user = profile.username || '';
    P.img = profile.avatar_url || null;
    P.email = user.email || '';
    P.id = user.id;
    return profile;
  }

  function clearDemoState() {
    C.splice(0, C.length);
    K.splice(0, K.length);
    F.clear(); R.splice(0, R.length); S.clear();
    Object.keys(U).forEach(k => { if (k !== 'me') delete U[k]; });
    U.me = { n: P.name || 'You' };
    P.file = null;
  }

  function openApp() {
    $('#auth').hidden = true;
    const oldOnboard = $('#uname'); if (oldOnboard) oldOnboard.remove();
    $('#app').hidden = false;
    closeConv();
    clearDemoState();
    render();
  }

  async function finishAuth(user) {
    if (finishingUserId === user.id && finishPromise) return finishPromise;
    finishingUserId = user.id;
    finishPromise = (async () => {
      try {
        const profile = await ensureProfile(user);
        openApp();
        if (!profile.username) showProfileSetup();
      } catch (error) {
        console.error('Cosmic Chat profile setup:', error);
        toast('Signed in, but profile setup failed: ' + authError(error));
      } finally {
        finishingUserId = null;
        finishPromise = null;
      }
    })();
    return finishPromise;
  }

  function showPasswordRecovery() {
    const password = el('input', { class:'field', type:'password', placeholder:'New password', autocomplete:'new-password' });
    const confirm = el('input', { class:'field', type:'password', placeholder:'Confirm new password', autocomplete:'new-password' });
    const save = btn('Update password', async () => {
      if (password.value.length < 6) return toast('Use at least 6 characters.');
      if (password.value !== confirm.value) return toast('The passwords do not match.');
      save.disabled = true;
      const { error } = await db.auth.updateUser({ password: password.value });
      save.disabled = false;
      if (error) return toast(authError(error));
      document.querySelectorAll('.modal').forEach(m=>m.remove());
      toast('Password updated successfully.');
    });
    sheet(el('b',{},'Choose a new password'), password, confirm, save,
      el('small',{},'Use at least 6 characters. Keep it private.'));
  }

  function showProfileSetup() {
    const existing = document.querySelector('.modal');
    if (existing) existing.remove();
    const name = el('input', { class:'field', value:P.name || '', maxlength:'60', placeholder:'Display name' });
    const username = el('input', { class:'field', placeholder:'Choose a username', maxlength:'20', autocomplete:'off', autocapitalize:'none', spellcheck:'false' });
    const bio = el('input', { class:'field', placeholder:'A short bio (optional)', maxlength:'160' });
    const status = el('small', { class:'ust' }, '3–20 characters. Start with a letter; use letters, numbers or underscores.');
    const save = el('button', { class:'btn' }, 'Save profile');
    const card = el('div', { class:'card' },
      el('h1', {}, 'Complete your profile'),
      el('p', { class:'tag' }, 'Choose a unique username so people can find you on Cosmic Chat.'),
      name, el('div', { class:'atf' }, el('span', {}, '@'), username), status, bio, save
    );
    const modal = el('div', { class:'modal' }, el('div', { class:'sheet' }, card));
    document.body.append(modal);
    username.focus();
    save.onclick = async () => {
      const u = cleanUsername(username.value);
      if (!name.value.trim()) return toast('Enter your display name.');
      if (!validUsername(u)) return toast('Username must be 3–20 characters and start with a letter.');
      save.disabled = true; save.textContent = 'Saving…';
      const { data, error } = await db.from('profiles').update({
        display_name: name.value.trim(), username: u, bio: bio.value.trim()
      }).eq('id', cosmicUser.id).select('id,display_name,username,bio,avatar_url').single();
      save.disabled = false; save.textContent = 'Save profile';
      if (error) { status.textContent = authError(error); status.className = 'ust bad'; return; }
      cosmicProfile = data; P.name=data.display_name; P.user=data.username; P.bio=data.bio||'';
      modal.remove(); render(); toast('Your Cosmic Chat profile is ready.');
    };
  }

  // Replace demo-only profile editor with a database-backed profile editor.
  vProfile = function(v) {
    const nm = el('input', { class:'field', value:P.name || '', maxlength:'60', placeholder:'Display name' });
    const bio = el('input', { class:'field', value:P.bio || '', maxlength:'160', placeholder:'About you' });
    const un = el('input', { class:'field', value:P.user || '', maxlength:'20', placeholder:'Username' });
    const avatar = el('input', { class:'field', value:P.img || '', placeholder:'Profile photo URL (optional)', inputmode:'url' });
    const stat = (n,l) => el('div', {}, el('b', {}, n), l);
    const save = btn('Save changes', async () => {
      const username = cleanUsername(un.value);
      if (!nm.value.trim()) return toast('Enter your display name.');
      if (!validUsername(username)) return toast('Username must be 3–20 characters and start with a letter.');
      if (avatar.value.trim() && !/^https:\/\/\S+/i.test(avatar.value.trim())) return toast('Profile photo URL must start with https://');
      save.disabled = true;
      const { data, error } = await db.from('profiles').update({
        display_name: nm.value.trim(), username, bio: bio.value.trim(),
        avatar_url: avatar.value.trim() || null
      }).eq('id', cosmicUser.id).select('id,display_name,username,bio,avatar_url').single();
      save.disabled = false;
      if (error) return toast(authError(error));
      cosmicProfile=data; P.name=data.display_name; P.user=data.username; P.bio=data.bio||''; P.img=data.avatar_url||null;
      U.me.n=P.name; toast('Profile saved to your account.'); render();
    });
    v.replaceChildren(
      el('h2', {}, 'Profile'),
      el('div', { class:'pcard phead' },
        av(P.name || 'You', 1, 92, P.img),
        el('b', { class:'gname' }, P.name || 'Your name'),
        el('small', {}, '@' + (P.user || 'username not set')),
        P.bio ? el('small', { style:'white-space:normal;text-align:center' }, P.bio) : null,
        el('small', {}, cosmicUser?.email || ''),
        el('div', { class:'stats' }, stat('—','Friends'), stat('—','Communities'), stat('—','Chats'))
      ),
      el('div', { class:'sec' }, 'Edit profile'),
      el('div', { class:'pcard' },
        el('label', { class:'lbl' }, 'Display name', nm),
        el('label', { class:'lbl' }, 'Username', un),
        el('label', { class:'lbl' }, 'About', bio),
        el('label', { class:'lbl' }, 'Profile photo URL', avatar),
        el('small', { style:'white-space:normal' }, 'Usernames are unique across Cosmic Chat. Profile photo upload will be connected after the storage policy is prepared.'),
        el('div', { style:'width:100%;display:flex;justify-content:flex-end' }, save)
      ),
      el('div', { class:'sec' }, 'Account'),
      el('div', { class:'pcard list' },
        row(ic('profile'), 'Account ID', cosmicUser.id, btn('Copy', () => navigator.clipboard?.writeText(cosmicUser.id).then(()=>toast('Account ID copied.')).catch(()=>toast('Copy is unavailable.'))), null),
        row(ic('set'), 'Password reset', 'Send a reset link to your email', btn('Send link', async () => {
          if (!cosmicUser.email) return toast('No email is available for this account.');
          const { error } = await db.auth.resetPasswordForEmail(cosmicUser.email, { redirectTo: redirectUrl() });
          toast(error ? authError(error) : 'Password reset email sent.');
        }), null),
        row(ic('set'), 'Settings', 'Notifications and appearance', null, () => settings())
      ),
      el('button', { class:'btn alt', style:'margin:16px;width:calc(100% - 32px)', onclick:signOut }, 'Sign out')
    );
  };

  async function searchProfiles(query, host) {
    const q = cleanUsername(query);
    if (!q) { host.replaceChildren(el('small',{class:'empty'},'Enter a username to find people.')); return; }
    const { data, error } = await db.from('profiles')
      .select('id,username,display_name,bio,avatar_url')
      .ilike('username', q + '%')
      .neq('id', cosmicUser.id)
      .order('username').limit(12);
    if (error) { host.replaceChildren(el('small',{class:'empty'},authError(error))); return; }
    if (!data.length) { host.replaceChildren(el('small',{class:'empty'},'No matching Cosmic Chat users found.')); return; }
    host.replaceChildren(...data.map(profile => row(
      av(profile.display_name || profile.username || '?', false, 0, profile.avatar_url),
      profile.display_name || profile.username,
      '@' + (profile.username || 'username not set') + (profile.bio ? ' · ' + profile.bio : ''),
      btn('View', () => {
        sheet(el('div',{class:'ginfo'},av(profile.display_name || profile.username, false, 88, profile.avatar_url),
          el('b',{class:'gname'},profile.display_name || profile.username),
          el('small',{},'@'+(profile.username||'')),
          profile.bio ? el('small',{},profile.bio) : null,
          el('small',{},'Cosmic Chat member')
        ));
      }), null
    )));
  }

  // Friends tab becomes a real username directory rather than seeded demo people.
  vFriends = function(v) {
    const input = el('input', { class:'field', placeholder:'Find people by @username', autocomplete:'off', autocapitalize:'none' });
    const resultsBox = el('div', {});
    input.oninput = () => {
      clearTimeout(profileSearchTimer);
      const value = input.value;
      profileSearchTimer = setTimeout(() => searchProfiles(value, resultsBox), 280);
    };
    v.replaceChildren(el('h2',{},'Find people'), el('div',{style:'padding:0 18px 8px'},input),
      el('small',{style:'display:block;padding:0 18px'},'Search real Cosmic Chat accounts by username.'),
      resultsBox,
      el('p',{class:'empty'},'Search for a username to discover people.'));
  };

  // Global search only searches real profiles in this phase.
  results = function(q, v) {
    const box = el('div', {});
    v.replaceChildren(el('h2',{},'People'), box);
    searchProfiles(q, box);
  };

  // Replace demo "new chat" people with username lookup. Actual message transport is Phase 3.
  newChat = function() {
    const input = el('input', { class:'field', placeholder:'Enter @username', autocomplete:'off', autocapitalize:'none' });
    const box = el('div', {});
    const modal = sheet(el('b',{},'Find a Cosmic Chat user'), input, box,
      btn('Search', () => searchProfiles(input.value, box), 1),
      el('small',{},'Private messaging will be connected to your real conversations in Phase 3.')
    );
    input.onkeydown = e => { if (e.key === 'Enter') searchProfiles(input.value, box); };
    setTimeout(()=>input.focus(),50);
  };

  // Real sign-out; local demo identity is never reused.
  signOut = async function() {
    document.querySelectorAll('.modal').forEach(m=>m.remove());
    const { error } = await db.auth.signOut();
    if (error) return toast(authError(error));
    cosmicUser=null; cosmicProfile=null;
    $('#app').hidden=true; $('#auth').hidden=false; closeConv();
    $('#pw').value=''; $('#email').value='';
    if (location.hash) history.replaceState(null,'',location.pathname+location.search);
    toast('Signed out safely.');
  };

  $('#toggle').onclick = () => {
    mode = mode === 'in' ? 'up' : 'in';
    $('#name').hidden = mode === 'in';
    $('#auwrap').hidden = $('#aust').hidden = mode === 'in';
    $('#email').placeholder = mode === 'in' ? 'Your email address' : 'Email address';
    $('#email').type = 'email';
    $('#go').textContent = mode === 'in' ? 'Sign in' : 'Create account';
    $('#toggle').textContent = mode === 'in' ? 'New here? Create an account' : 'Have an account? Sign in';
    $('.tag').textContent = mode === 'in' ? 'Sign in to your Cosmic Chat account.' : 'A verification email may be required before your first sign-in.';
  };

  // Username availability is not guessed locally. The unique database index is authoritative.
  $('#auser').oninput = () => {
    $('#auser').dataset.t='1';
    $('#auser').value=cleanUsername($('#auser').value).replace(/[^a-z0-9_]/g,'');
    const value=$('#auser').value, status=$('#aust');
    if (!value) { status.textContent='Choose a unique username.'; status.className='ust'; return; }
    status.textContent=validUsername(value) ? 'Username format looks good. Availability is confirmed when saved.' : 'Use 3–20 characters, start with a letter, and use only letters, numbers or underscores.';
    status.className='ust'+(validUsername(value)?' good':' bad');
  };
  $('#name').oninput = () => {
    if (!$('#auser').dataset.t) {
      $('#auser').value=String($('#name').value||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
      $('#auser').dispatchEvent(new Event('input'));
    }
  };

  $('#go').onclick = async () => {
    const email=$('#email').value.trim(), password=$('#pw').value;
    if (!email || !password) return toast('Enter your email and password.');
    if (mode === 'up') {
      const displayName=$('#name').value.trim(), username=cleanUsername($('#auser').value);
      if (!displayName) return toast('Enter your name.');
      if (!validUsername(username)) return toast('Choose a valid username first.');
      if (password.length < 6) return toast('Password must be at least 6 characters.');
      setBusy(true);
      const { data, error } = await db.auth.signUp({
        email, password,
        options: { data: { display_name: displayName, username }, emailRedirectTo: redirectUrl() }
      });
      setBusy(false);
      if (error) return showAuthError(error);
      if (data.session && data.user) {
        try {
          const existing=await readProfile(data.user);
          if (!existing) {
            const { error: insertError } = await db.from('profiles').insert({id:data.user.id,display_name:displayName,username,bio:''});
            if (insertError) throw insertError;
          } else {
            const { error: updateError } = await db.from('profiles').update({display_name:displayName,username}).eq('id',data.user.id);
            if (updateError) throw updateError;
          }
          await finishAuth(data.user);
        } catch (e) { showAuthError(e); }
      } else {
        toast('Account created. Check your email to verify it, then sign in.');
        mode='in'; $('#toggle').textContent='New here? Create an account';
        $('#name').hidden=true; $('#auwrap').hidden=$('#aust').hidden=true;
        $('#go').textContent='Sign in';
      }
      return;
    }
    setBusy(true);
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) return showAuthError(error);
    if (data.user) await finishAuth(data.user);
  };

  $('#google').onclick = async () => {
    const { error } = await db.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo:redirectUrl(), queryParams:{ prompt:'select_account' } }
    });
    if (error) showAuthError(error);
  };

  // Password reset from the sign-in screen.
  const resetButton = el('button',{class:'link',style:'padding:4px'},'Forgot password?');
  resetButton.onclick = async () => {
    const email=$('#email').value.trim();
    if (!email) return toast('Enter your email address first.');
    const { error } = await db.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl()});
    toast(error ? authError(error) : 'Password reset email sent. Check your inbox.');
  };
  $('#toggle').after(resetButton);

  // Restore the authenticated session on refresh and respond to auth changes.
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      if (session?.user) setTimeout(() => finishAuth(session.user), 0);
      setTimeout(showPasswordRecovery, 150);
      return;
    }
    if (session?.user) {
      setTimeout(() => finishAuth(session.user), 0);
    } else if (event === 'SIGNED_OUT') {
      cosmicUser=null; cosmicProfile=null;
      if (!$('#app').hidden) { $('#app').hidden=true; $('#auth').hidden=false; }
    }
  });
  (async () => {
    const { data, error } = await db.auth.getSession();
    if (error) { console.error(error); return; }
    if (data.session?.user) await finishAuth(data.session.user);
    else {
      $('#app').hidden=true; $('#auth').hidden=false;
      $('.tag').textContent='Sign in with your email or Google account.';
    }
  })();
})();
</script>

</body></html>
