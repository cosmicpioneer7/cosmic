@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.glass{background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.015) 45%),rgba(10,13,26,.55);border:1px solid rgba(255,255,255,.11);box-shadow:0 18px 50px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 40px rgba(120,140,255,.04)}

<div id="intro"><small>Cosmic Pioneer</small><h1>Universe Explorer</h1><p>Travel from Earth to the edge of everything. Forty-six billion light-years in a few minutes.</p><button id="begin">Begin the journey</button></div>

<script>
(function(){
const $=id=>document.getElementById(id),V3=THREE.Vector3;
const coarse=matchMedia('(pointer:coarse)').matches,Q=1.5;
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:false,powerPreference:'high-performance'});

function galaxy(n,Rg,pos,tx,tz,arms,warm,blue){const e=new THREE.Euler(tx,0,tz),v=new V3();
 for(let i=0;i<n;i++){let r,a,y,c;
  if(Math.random()<.2){r=Math.abs(gauss())*Rg*.09;a=Math.random()*6.283;y=gauss()*Rg*.05;c=c1.set(warm).clone()}
  else{r=Rg*Math.min(1,-Math.log(1-Math.random()*.97)*.28+.02);const k=Math.floor(Math.random()*arms);
   a=k*6.283/arms+r/Rg*9+gauss()*(.2+.1*(1-r/Rg));y=gauss()*Rg*.007*(1+3*(1-r/Rg));
   c=c1.set(warm).clone().lerp(c2.set(blue),Math.min(1,r/Rg*1.3));if(Math.random()<.05)c.set('#ff8ab8')}
  v.set(r*Math.cos(a),y,r*Math.sin(a)).applyEuler(e).add(pos);add(v.x,v.y,v.z,c.multiplyScalar(.7+Math.random()*.5),.9+Math.random()*1.6)}}
const WARM='#ffd9a0',BLUE='#8fa8ff',O0=new V3();
galaxy(55e3*Q|0,50,O0,0,0,4,WARM,BLUE);
const A=at(121,-21,2537e3),M33=at(134.6,-31.3,2730e3),LMC=at(280,-33,163e3),SMC=at(302,-44,200e3);
galaxy(16e3*Q|0,110,A,.9,.4,2,WARM,BLUE);galaxy(4500*Q|0,38,M33,.5,-.8,3,'#ffe6c0','#9fb8ff');
galaxy(2500*Q|0,7,LMC,1.1,.2,1,'#ffe0b0','#a9c0ff');galaxy(1200*Q|0,3.5,SMC,.3,.5,1,'#ffe0b0','#a9c0ff');
const pal=['#ffd9a0','#fff4e8','#bcd0ff','#ffb48a','#ffffff'];
for(let i=0;i<3000*Q;i++)add(SUN.x+gauss()*.035,gauss()*.03,gauss()*.035,c1.set(pal[i%5]).clone(),.8+Math.random()*1.8);
add(SUN.x,SUN.y,SUN.z,c1.set('#fff2c8').clone(),10);
const rd=()=>new V3(gauss(),gauss(),gauss()).normalize();
for(let s=0;s<1100*Q;s++){const r=Math.pow(10,4.4+3.15*Math.pow(Math.random(),.8)),p=rd().multiplyScalar(r),d=rd(),st=r*.03,h=.6+Math.random()*.12;
 for(let k=0;k<36;k++){d.add(rd().multiplyScalar(.35)).normalize();p.addScaledVector(d,st);add(p.x+gauss()*st*.3,p.y+gauss()*st*.3,p.z+gauss()*st*.3,c1.setHSL(h,.55,.62).clone().multiplyScalar(.9),1+Math.random()*1.2)}}
for(let i=0;i<5000*Q;i++){const p=rd().multiplyScalar(4.65e7);add(p.x,p.y,p.z,c1.set('#ff7a35').clone().multiplyScalar(.5+Math.random()*.4),1.6)}
const named=[['Alpha Centauri',315,-1,4.37,6,'#ffe2b0'],['Sirius',227,-9,8.6,8,'#d6e4ff'],['Vega',67,19,25,8,'#cfe0ff'],['Arcturus',15,69,37,8,'#ffc58a'],['Polaris',123,27,433,8,'#fff2d0'],['Betelgeuse',199,-9,548,9,'#ff9a6a'],['Antares',352,15,550,9,'#ff8a60'],['Rigel',210,-25,860,9,'#bcd0ff'],['Deneb',84,2,2600,9,'#dfe8ff']];
