<style>
:root {
  color-scheme: dark;
  --bg: #0b1014;
  --panel: #161d24;
  --field: #202930;
  --line: rgba(255,255,255,.07);
  --text: #e9edef;
  --muted: #8696a0;
  --grad: #1d5fae;
  --accent: #53a6fa;
  --onaccent: #fff;
  --danger: #ff7a90;
  --read: #53bdeb;
  --chip: rgba(83,166,250,.16);
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #f4f6fb;
  --panel: #ffffff;
  --field: #e8ecf6;
  --line: rgba(0,0,0,.08);
  --text: #161a2b;
  --muted: #5f6784;
  --grad: #4a6fa5;
  --accent: #3d5f94;
  --onaccent: #fff;
  --read: #2f6fb5;
  --chip: rgba(61,95,148,.12);
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: rgba(138,150,166,.35) transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input, textarea {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
input::selection, textarea::selection {
  background: rgba(83,166,250,.35);
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  font: 16px/1.4 'Outfit', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
*, button, .tab, .chip, .row, .fab, .chead-pill, .av-tap, .ppop-hero {
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app {
  --lw: 340px;
  position: relative;
  max-width: 560px;
  width: 100%;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
@media (min-width: 720px) {
  .app {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}
.glass-top,
.glass-bot {
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity .22s ease;
}
.glass-top {
  top: 0;
  height: calc(116px + env(safe-area-inset-top, 0px));
  backdrop-filter: blur(20px) saturate(145%);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  background: linear-gradient(to bottom, rgba(11, 16, 20, .86) 0%, rgba(11, 16, 20, .58) 64%, rgba(11, 16, 20, 0) 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 66%, rgba(0, 0, 0, .55) 85%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 66%, rgba(0, 0, 0, .55) 85%, transparent 100%);
}
:root[data-theme=light] .glass-top {
  background: linear-gradient(to bottom, rgba(244, 246, 251, .88) 0%, rgba(244, 246, 251, .6) 64%, rgba(244, 246, 251, 0) 100%);
}
.glass-bot {
  bottom: 0;
  height: calc(88px + env(safe-area-inset-bottom, 0px));
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  background: linear-gradient(to top, rgba(11, 16, 20, .85) 0%, rgba(11, 16, 20, .48) 56%, rgba(11, 16, 20, 0) 100%);
  -webkit-mask-image: linear-gradient(to top, #000 0%, #000 58%, rgba(0, 0, 0, .5) 82%, transparent 100%);
  mask-image: linear-gradient(to top, #000 0%, #000 58%, rgba(0, 0, 0, .5) 82%, transparent 100%);
}
:root[data-theme=light] .glass-bot {
  background: linear-gradient(to top, rgba(244, 246, 251, .88) 0%, rgba(244, 246, 251, .52) 56%, rgba(244, 246, 251, 0) 100%);
}
.hd {
  position: relative;
  z-index: 3;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 0 18px;
}
.hd h1, .card h1 {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-weight: 700;
  letter-spacing: -.4px;
  color: #53a6fa;
}
:root[data-theme=light] .hd h1, :root[data-theme=light] .card h1 {
  color: #1d6fd6;
}
.hd h1 {
  flex: 1;
  margin: 0;
  font-size: 23px;
  line-height: 1.3;
  padding-bottom: 2px;
}
.ib {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  flex: none;
  transition: transform .18s cubic-bezier(.22, 1.35, .36, 1), background-color .18s ease;
}
.hd .ib {
  width: 40px;
  height: 40px;
}
.ib:active {
  background: var(--panel);
  transform: scale(.91);
}
.ic {
  display: inline-flex;
}
.search {
  position: relative;
  z-index: 3;
  flex: 0 0 auto;
  margin: 8px 16px 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 14px 0 16px;
  border-radius: 999px;
  background: rgba(32, 41, 48, .68);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, .09);
  color: var(--muted);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
  transition: box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
}
:root[data-theme=light] .search {
  background: rgba(232, 236, 246, .74);
  border-color: rgba(0, 0, 0, .08);
  box-shadow: 0 4px 14px rgba(22, 26, 43, .06);
}
.search:focus-within {
  border-color: rgba(83, 166, 250, .45);
  box-shadow: 0 0 0 3px rgba(83, 166, 250, .14);
}
.search #sico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  color: var(--muted);
  transition: color .2s ease;
}
.search:focus-within #sico {
  color: var(--accent);
}
.search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: none;
  border: 0;
  outline: 0;
  font-size: 15.5px;
  line-height: 1.2;
  color: var(--text);
  text-overflow: ellipsis;
}
.search input::placeholder {
  color: var(--muted);
}
.search .sclr {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  background: rgba(255, 255, 255, .08);
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
}
:root[data-theme=light] .search .sclr {
  background: rgba(0, 0, 0, .07);
}
.search .sclr:active {
  transform: scale(.9);
}
.chip {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
  flex: none;
  transition: transform .18s cubic-bezier(.22, 1.35, .36, 1), background-color .2s, color .2s;
}
.chip:active {
  transform: scale(.93);
}
.chip.on {
  background: var(--chip);
  border-color: transparent;
  color: var(--accent);
}
#view {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: calc(108px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  scroll-padding-top: calc(114px + env(safe-area-inset-top, 0px));
  overscroll-behavior: contain;
  touch-action: pan-y;
  will-change: transform, opacity;
}
.app.no-search .search {
  display: none !important;
}
.app.no-search .glass-top {
  height: calc(62px + env(safe-area-inset-top, 0px));
}
.app.no-search #view {
  padding-top: calc(56px + env(safe-area-inset-top, 0px));
  scroll-padding-top: calc(62px + env(safe-area-inset-top, 0px));
}
#view.slide-l {
  animation: tabSlideL .24s cubic-bezier(.22, .85, .32, 1) both;
}
#view.slide-r {
  animation: tabSlideR .24s cubic-bezier(.22, .85, .32, 1) both;
}
@keyframes tabSlideL {
  from { opacity: .35; transform: translateX(34px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes tabSlideR {
  from { opacity: .35; transform: translateX(-34px); }
  to { opacity: 1; transform: translateX(0); }
}
.row {
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 12px 18px;
  transition: transform .2s cubic-bezier(.22, 1.35, .36, 1), background-color .16s ease;
}
button.row:active {
  background: var(--panel);
  --av-cutout: var(--panel);
  transform: scale(.985);
}
.g {
  flex: 1;
  min-width: 0;
}
.g b {
  font-weight: 500;
  font-size: 17px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sub {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pcard.list .row .sub,
.sheet .row .sub {
  display: block;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  overflow-wrap: anywhere;
  line-height: 1.32;
  margin-top: 2px;
}
small {
  color: var(--muted);
  font-size: 13px;
}
.rt {
  display: grid;
  justify-items: end;
  gap: 6px;
  color: var(--muted);
}
.rt.u small {
  color: #53a6fa;
}
:root[data-theme=light] .rt.u small {
  color: #1d6fd6;
}
.badge {
  background: #3b8ee8;
  color: #04121f;
  border-radius: 99px;
  font-size: 12px;
  min-width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  font-weight: 600;
}
:root[data-theme=light] .badge,
:root[data-theme=light] .tp .badge {
  background: #1d6fd6;
  color: #ffffff;
}
.badge.mut {
  background: var(--muted);
  color: var(--bg);
}
.tk, .tick {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  color: var(--muted);
  flex: none;
  line-height: 0;
}
.tk svg, .tick svg {
  display: block;
  overflow: visible;
}
.tk.r, .tick.r {
  color: #53bdeb;
}
:root[data-theme=light] .tk.r,
:root[data-theme=light] .tick.r {
  color: #1d8cf8;
}
.sec {
  margin: 16px 18px 6px;
  color: var(--muted);
  font-size: 14px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 32px;
}
h2 {
  margin: 8px 18px 6px;
  font-size: 22px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.av {
  --h: 200;
  --s: 56px;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: 50%;
  background: hsl(var(--h) 45% 17%);

function playTone(name) {
  if (!name || name === 'Silent') return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_actx) _actx = new Ctx();
    if (_actx.state === 'suspended') _actx.resume();
    const t0 = _actx.currentTime;
    const seq = name === 'Nebula Pop' ? [[560, 0, .1, 'triangle']]
      : name === 'Aurora Pulse' ? [[440, 0, .13], [554, .11, .13], [659, .22, .22]]
      : [[880, 0, .16], [1175, .13, .28]];
    seq.forEach(([f, d, len, type]) => {
      const o = _actx.createOscillator(), g = _actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(.14, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d + len);
      o.connect(g);
      g.connect(_actx.destination);
      o.start(t0 + d);
      o.stop(t0 + d + len + .03);
    });
  } catch (e) {}
}
let _bannerT = 0, _bannerEl = null;
function dismissBanner(b, dir = 'up', dx = 0) {
  if (!b || b._gone) return;
  b._gone = true;
  clearTimeout(_bannerT);
  if (_bannerEl === b) _bannerEl = null;
  b.style.animation = 'none';
  b.style.transition = 'transform .22s cubic-bezier(.32, 0, .67, 1), opacity .2s ease';
  if (dir === 'left') b.style.transform = 'translate3d(calc(-50% - 115%), 0, 0)';
  else if (dir === 'right') b.style.transform = 'translate3d(calc(-50% + 115%), 0, 0)';
  else b.style.transform = 'translate3d(calc(-50% + ' + dx + 'px), -140%, 0)';
  b.style.opacity = '0';
  setTimeout(() => b.remove(), 220);
}
function showBanner(name, text, onTap, avatarImg) {
  if (_bannerEl) _bannerEl.remove();
  clearTimeout(_bannerT);
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false, t0 = 0;
  const b = _bannerEl = el('button', {
    class: 'banner',
    'aria-label': 'Notification from ' + name,
    onclick: e => {
      if (moved) { e.preventDefault(); e.stopPropagation(); return; }
      clearTimeout(_bannerT);
      b.remove();
      if (_bannerEl === b) _bannerEl = null;
      onTap && onTap();
    }
  },
    av(name, 0, 40, avatarImg),
    el('div', { class: 'g' }, el('b', {}, name), el('small', {}, text)));

  b.addEventListener('pointerdown', e => {
    if (b._gone) return;
    sx = e.clientX;
    sy = e.clientY;
    dx = 0;
    dy = 0;
    dragging = true;
    moved = false;
    t0 = Date.now();
    clearTimeout(_bannerT);
    b.style.animation = 'none';
    b.style.transition = 'none';
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
  });

  b.addEventListener('pointermove', e => {
    if (!dragging || b._gone) return;
    dx = e.clientX - sx;
    dy = e.clientY - sy;
    if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) moved = true;
    if (!moved) return;
    const clampedY = dy < 0 ? dy : dy * 0.25;
    b.style.transform = 'translate3d(calc(-50% + ' + dx + 'px), ' + clampedY + 'px, 0)';
    const progress = Math.min(1, Math.max(Math.abs(dx) / 160, Math.max(0, -dy) / 70));
    b.style.opacity = String(Math.max(0.25, 1 - progress * 0.72));
  });

  const endDrag = () => {
    if (!dragging || b._gone) return;
    dragging = false;
    const dt = Math.max(1, Date.now() - t0);
    const vx = Math.abs(dx) / dt;
    const vy = -dy / dt;
    if (dy < -28 || (dy < -14 && vy > 0.35)) {
      haptic('soft');
      dismissBanner(b, 'up', dx);
      return;
    }
    if (Math.abs(dx) > 75 || (Math.abs(dx) > 32 && vx > 0.45)) {
      haptic('soft');
      dismissBanner(b, dx < 0 ? 'left' : 'right', dx);
      return;
    }
    b.style.transition = 'transform .24s cubic-bezier(.2, .9, .3, 1.15), opacity .2s ease';
    b.style.transform = 'translate3d(-50%, 0, 0)';
    b.style.opacity = '1';
    _bannerT = setTimeout(() => dismissBanner(b, 'up', 0), 3600);
  };

  b.addEventListener('pointerup', endDrag);
  b.addEventListener('pointercancel', endDrag);

async function loadConversations() {
  if (!sb || !activeUserId) return;
  const membershipResult = await sb.from('conversation_members')
    .select('conversation_id, user_id, role, last_read_at')
    .eq('user_id', activeUserId);
  if (membershipResult.error) throw membershipResult.error;
  const memberships = membershipResult.data || [];
  const ids = [...new Set(memberships.map(x => x.conversation_id))];
  if (!ids.length) { C = []; render(); return; }

  const [convResult, memberResult, messageResult] = await Promise.all([
    sb.from('conversations').select('id, kind, title, created_by, created_at').in('id', ids),
    sb.from('conversation_members').select('conversation_id, user_id, role').in('conversation_id', ids),
    sb.from('messages').select('id, conversation_id, sender_id, body, message_type, created_at, edited_at, deleted_at')
      .in('conversation_id', ids).order('created_at', { ascending: true }).limit(1500)
  ]);
  if (convResult.error) throw convResult.error;
  if (memberResult.error) throw memberResult.error;
  if (messageResult.error) throw messageResult.error;

  const allMemberIds = [...new Set((memberResult.data || []).map(x => x.user_id))];
  const profileResult = allMemberIds.length
    ? await sb.from('profiles').select('id, username, display_name, avatar_url, bio').in('id', allMemberIds)
    : { data: [], error: null };
  if (profileResult.error) throw profileResult.error;
  (profileResult.data || []).forEach(profile => {
    U[profile.id] = { n: profile.display_name || profile.username, username: profile.username, img: profile.avatar_url || '', bio: profile.bio || '', on: false };
  });

  const memberMap = new Map();
  (memberResult.data || []).forEach(m => {
    if (!memberMap.has(m.conversation_id)) memberMap.set(m.conversation_id, []);
    memberMap.get(m.conversation_id).push(m);
  });
  const messageMap = new Map();
  (messageResult.data || []).forEach(row => {
    if (!messageMap.has(row.conversation_id)) messageMap.set(row.conversation_id, []);
    messageMap.get(row.conversation_id).push(mapDbMessage(row));
  });
  C = (convResult.data || []).map(row => {
    const members = memberMap.get(row.id) || [];
    const others = members.filter(m => m.user_id !== activeUserId).map(m => m.user_id);
    const isGroup = row.kind !== 'direct';
    const msgsForChat = messageMap.get(row.id) || [];
    return {
      id: row.id, g: isGroup ? 1 : 0, k: row.kind === 'community' ? 1 : 0,
      name: row.title || (isGroup ? 'Group chat' : (U[others[0]]?.n || 'Private chat')),
      m: others, adm: members.filter(m => ['owner','admin','moderator'].includes(m.role)).map(m => m.user_id === activeUserId ? 'me' : m.user_id),
      msgs: msgsForChat, unread: 0, n: members.length, dis: 0, createdAt: row.created_at
    };
  }).filter(c => c.g || c.m.length);
  render();
}

async function dm(k) {
  if (!sb || !activeUserId) return toast('Please sign in first.');
  try {
    const { data: conversationId, error } = await sb.rpc('create_or_get_direct_conversation', { target_user: k });
    if (error) throw error;
    await loadConversations();
    const conversation = find(conversationId);
    if (!conversation) throw new Error('Conversation could not be loaded.');
    tab = 'chats';
    closeSheet();
    open(conversation.id);
  } catch (e) {
    console.error('Could not open direct conversation:', e);
    toast(e.message || 'Could not start this conversation.');
  }
}

(() => {
  const v = $('#view');
  const ORDER = ['chats', 'friends', 'comm', 'profile'];
  let x0 = 0, y0 = 0, dx = 0, active = false, locked = false, crossed = false;

  const reset = animate => {
    v.style.transition = animate ? 'transform .22s cubic-bezier(.22,.85,.32,1), opacity .22s ease' : 'none';
    v.style.transform = '';
    v.style.opacity = '';
    active = false;
    locked = false;
    crossed = false;
  };

  v.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || cur !== null || $('#q').value.trim() || document.querySelector('.modal')) return;
    if (e.target.closest('.tray, .sw-row, input, textarea, [data-noswipe]')) return;
    const t = e.touches[0];
    x0 = t.clientX;
    y0 = t.clientY;
    dx = 0;
    active = false;
    locked = false;
    crossed = false;
    v.style.transition = 'none';
  }, { passive: true });

  v.addEventListener('touchmove', e => {
    if (locked || cur !== null || $('#q').value.trim() || !x0) return;
    const t = e.touches[0];
    const mx = t.clientX - x0;
    const my = t.clientY - y0;

    if (!active) {
      if (Math.abs(my) > Math.abs(mx) && Math.abs(my) > 10) {
        locked = true;
        return;
      }
      if (Math.abs(mx) > 14 && Math.abs(mx) > Math.abs(my) * 1.35) {
        active = true;
      } else {
        return;
      }
    }

    const idx = ORDER.indexOf(tab);
    const atStart = idx <= 0 && mx > 0;
    const atEnd = idx >= ORDER.length - 1 && mx < 0;
    const damp = (atStart || atEnd) ? 0.25 : 0.72;
    dx = Math.max(-130, Math.min(130, mx * damp));
    v.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
    if (!atStart && !atEnd) {
      v.style.opacity = String(Math.max(0.68, 1 - Math.abs(dx) / 360));
      const nowCrossed = Math.abs(dx) >= 48;
      if (nowCrossed && !crossed) {
        crossed = true;
        const targetTab = ORDER[idx + (dx < 0 ? 1 : -1)];
        const tabEl = document.querySelector('.tab[data-k="' + targetTab + '"] .tp');
        haptic('detent', tabEl);
      } else if (!nowCrossed && crossed) {
        crossed = false;
      }
    }
  }, { passive: true });

  const endSwipe = () => {
    if (!x0) return;
    const wasActive = active, finalDx = dx;
    x0 = y0 = dx = 0;
    if (!wasActive) {
      active = false;
      locked = false;
      crossed = false;
      return;
    }
    const idx = ORDER.indexOf(tab);
    const threshold = 48;
    if (finalDx < -threshold && idx < ORDER.length - 1) {
      reset(false);
      go(ORDER[idx + 1], 'l', true);
    } else if (finalDx > threshold && idx > 0) {
      reset(false);
      go(ORDER[idx - 1], 'r', true);
    } else {
      reset(true);
    }
  };

  v.addEventListener('touchend', endSwipe, { passive: true });
  v.addEventListener('touchcancel', () => {
    x0 = y0 = dx = 0;
    reset(true);
  }, { passive: true });
})();

let QR_DET = null, QR_JS = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  if (QR_JS) return QR_JS;
  QR_JS = new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    sc.onload = () => res(window.jsQR || null);
    sc.onerror = () => { QR_JS = null; res(null); };
    document.head.append(sc);
  });
  return QR_JS;
}

async function qrDecode(source, w, h) {
  if ('BarcodeDetector' in window) {
    try {
      QR_DET = QR_DET || new BarcodeDetector({ formats: ['qr_code'] });
      const r = await QR_DET.detect(source);
      if (r && r.length) return r[0].rawValue;
    } catch (e) { QR_DET = null; }
  }
  const lib = await loadJsQR();
  if (!lib) return null;
  const k = Math.min(1, 720 / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(source, 0, 0, cw, ch);
  const d = cx.getImageData(0, 0, cw, ch);
  const r = lib(d.data, cw, ch, { inversionAttempts: 'attemptBoth' });
  return r ? r.data : null;
}

function qrParse(text) {
  const t = String(text || '').trim();
  const m = t.match(/^cosmicchat:add:([\w.]+)$/i) || t.match(/cosmicpioneer\.com\/@([\w.]+)/i) || t.match(/^@([\w.]+)$/);
  return m ? m[1].toLowerCase() : null;
}

  const k = Object.keys(U).find(x => x !== 'me' && ((U[x].user || '').toLowerCase() === q || U[x].n.toLowerCase() === q));
  if (!k) { haptic('warn'); return toast('No user found for @' + q); }
  if (F.has(k)) { haptic('soft'); return toast('Already friends with ' + U[k].n); }
  S.add(k);
  haptic('success');
  toast('Friend request sent to @' + q);
  render();
}

function scanSheet() {
  let stream = null, alive = true, busy = false, last = 0;
  const stop = () => {
    alive = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  };
  const vid = el('video', {});
  vid.setAttribute('playsinline', '');
  vid.muted = true;
  const msg = el('small', {}, 'Point your camera at a Cosmic Chat QR code');
  const box = el('div', { class: 'scan' }, vid, el('div', { class: 'scanfr' }), el('div', { class: 'scanln' }));
  const fi = el('input', { type: 'file', accept: 'image/*', hidden: true });

  const done = text => {
    const u = qrParse(text);
    if (!u) { haptic('warn'); msg.textContent = 'This is not a Cosmic Chat QR code'; return false; }
    stop();
    closeSheet(() => addFromQR(u));
    return true;
  };

  fi.onchange = async () => {
    const f = fi.files && fi.files[0];
    fi.value = '';
    if (!f) return;
    msg.textContent = 'Reading QR code…';
    try {
      const bmp = await createImageBitmap(f);
      const txt = await qrDecode(bmp, bmp.width, bmp.height);
      if (bmp.close) bmp.close();
      if (!txt) { haptic('warn'); msg.textContent = 'No QR code found in that photo. Try a clearer one.'; return; }
      done(txt);
    } catch (e) { msg.textContent = 'Could not read that image.'; }
  };

  const tick = async t => {
    if (!alive) return;
    requestAnimationFrame(tick);
    if (busy || t < last || vid.readyState < 2 || !vid.videoWidth) return;
    last = t + 220;
    busy = true;
    try {
      const txt = await qrDecode(vid, vid.videoWidth, vid.videoHeight);
      if (txt && alive && !done(txt)) last = performance.now() + 1800;
    } catch (e) {}
    busy = false;
  };

  const m = sheet(
    el('b', {}, 'Scan QR code'),
    el('div', { class: 'ginfo' }, box, msg),
    el('div', { style: 'display:flex;justify-content:center;padding:6px 18px 10px' }, btn('Scan from photo', () => fi.click(), 1), fi)
  );
  new MutationObserver((_, ob) => { if (!m.isConnected) { stop(); ob.disconnect(); } }).observe(document.body, { childList: true });

  if (!('BarcodeDetector' in window)) loadJsQR();
  (async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      box.classList.add('off');
      msg.textContent = 'Camera is not available here. Scan from a photo instead.';
      return;

      const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      if (!alive) { st.getTracks().forEach(t => t.stop()); return; }
      stream = st;
      vid.srcObject = st;
      await vid.play();
      requestAnimationFrame(tick);
    } catch (e) {
      box.classList.add('off');
      msg.textContent = e && e.name === 'NotAllowedError'
        ? 'Camera permission is blocked. Allow it in browser settings, or scan from a photo.'

function swipe(rw, b, m) {
  let x0 = 0, y0 = 0, dx = 0, on = false, armed = false;
  const back = () => { b.style.transition = 'transform .2s ease'; b.style.transform = ''; on = false; armed = false; };
  rw.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = false; armed = false; }, { passive: true });
  rw.addEventListener('touchmove', e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!on && mx > 12 && mx > Math.abs(my) * 1.5) on = true;
    if (!on) return;
    dx = Math.min(mx, 80);
    b.style.transition = 'none';
    b.style.transform = 'translateX(' + dx + 'px)';
    const nowArmed = dx > 56;
    rw.classList.toggle('arm', nowArmed);
    if (nowArmed && !armed) {
      armed = true;
      haptic('detent');
    } else if (!nowArmed && armed) {
      armed = false;
    }
  }, { passive: true });
  rw.addEventListener('touchend', () => {
    const go = on && dx > 56;
    rw.classList.remove('arm');
    back();
    if (go) {
      startReply(m);
    }
  });
  rw.addEventListener('touchcancel', () => { rw.classList.remove('arm'); back(); });
}

const emoParse = () => EMJ_P || (EMJ_P = EMJ.map(([k, l, t]) => ({ k, l, items: t.split('\n').map(line => { const i = line.indexOf(' '); let e = line.slice(0, i), m = 0; if (e.endsWith('*')) { e = e.slice(0, -1); m = 1; } return { e, m, n: line.slice(i + 1) }; }) })));
const EMJ_TONES = ['', '\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
let EMJ_TONE = 0, EMJ_RECENT = [];
try { EMJ_TONE = +localStorage.getItem('emo_tone') || 0; EMJ_RECENT = JSON.parse(localStorage.getItem('emo_recent') || '[]'); } catch (e) {}
const emjTone = (e, m) => {
  if (!m || !EMJ_TONE) return e;
  const cps = [...e], f = cps.shift();
  if (cps[0] === '\uFE0F') cps.shift();
  return f + EMJ_TONES[EMJ_TONE] + cps.join('');
};
function insertEmoji(e) {
  const t = $('#txt'), s = t.selectionStart == null ? t.value.length : t.selectionStart, en = t.selectionEnd == null ? s : t.selectionEnd;
  t.value = t.value.slice(0, s) + e + t.value.slice(en);
  try { t.setSelectionRange(s + e.length, s + e.length); } catch (x) {}
  t.dispatchEvent(new Event('input', { bubbles: true }));
  EMJ_RECENT = [e, ...EMJ_RECENT.filter(x => x !== e)].slice(0, 32);
  try { localStorage.setItem('emo_recent', JSON.stringify(EMJ_RECENT)); } catch (x) {}
}

function buildEmojiBody(toneBtn) {
  const key = EMJ_TONE + '|' + EMJ_RECENT.join('');
  if (EM_CACHE && EM_CACHE_KEY === key) return EM_CACHE;
  const cats = emoParse();
  const body = el('div', { class: 'emx' });
  const bar = el('div', { class: 'emcats' });
  const grid = el('div', { class: 'emgrid' });
  const secs = [];
  let lockSpy = false;

  grid.onclick = ev => {
    const b = ev.target.closest('button[data-e]');
    if (b) {
      haptic('tap');
      insertEmoji(b.dataset.e);
    }
  };

  const setActive = k => {
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  };

  const list = [];
  if (EMJ_RECENT.length) list.push({ k: 'recent', l: 'Recent', icon: '\u{1F552}', rows: EMJ_RECENT.map(e => [e, 'Recent']) });
  for (const c of cats) list.push({ k: c.k, l: c.l, icon: EMJ_ICON[c.k], rows: c.items.map(it => [emjTone(it.e, it.m), it.n]) });

  const frag = document.createDocumentFragment();
  const barFrag = document.createDocumentFragment();
  for (const s of list) {
    const h = el('h4', {}, s.l);
    const r = el('div', { class: 'emrow' });
    for (const [e, n] of s.rows) {
      const btn = document.createElement('button');
      btn.dataset.e = e;
      btn.title = n;
      btn.setAttribute('aria-label', n);
      btn.textContent = e;
      r.appendChild(btn);
    }
    const w = el('section', {}, h, r);
    frag.appendChild(w);
    secs.push([s.k, w]);

    const cb = document.createElement('button');
    cb.dataset.k = s.k;
    cb.setAttribute('aria-label', s.l);
    cb.textContent = s.icon;
    cb.onclick = () => {
      haptic('tap');
      lockSpy = true;
      setActive(s.k);
      grid.scrollTop = w.offsetTop;
      requestAnimationFrame(() => { lockSpy = false; });
    };
    barFrag.appendChild(cb);
  }
  grid.appendChild(frag);
  bar.appendChild(barFrag);

  let tick = 0;
  grid.onscroll = () => {
    if (lockSpy) return;
    if (!tick) tick = requestAnimationFrame(() => {
      tick = 0;
      let on = secs.length ? secs[0][0] : '';
      const st = grid.scrollTop + 24;
      for (const [k, w] of secs) if (w.offsetTop <= st) on = k;
      setActive(on);
    });
  };

  if (secs.length) setActive(secs[0][0]);
  body.append(bar, grid);
  EM_CACHE = body;
  EM_CACHE_KEY = key;
  return body;
}

function framer(file, done) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const SZ = 260, min = Math.max(SZ / im.width, SZ / im.height);
    let sc = min, x = (SZ - im.width * sc) / 2, y = (SZ - im.height * sc) / 2;
    const img = el('img', { src: url, alt: '', draggable: 'false' });
    const place = () => {
      x = Math.min(0, Math.max(SZ - im.width * sc, x));
      y = Math.min(0, Math.max(SZ - im.height * sc, y));
      img.style.width = im.width * sc + 'px';
      img.style.height = im.height * sc + 'px';
      img.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    };
    const box = el('div', { class: 'frame' }, img);
    place();
    let drag = null;
    box.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); };
    box.onpointermove = e => { if (!drag) return; x += e.clientX - drag.x; y += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; place(); };
    box.onpointerup = box.onpointercancel = () => { drag = null; };
    const z = el('input', { class: 'zoom', type: 'range', min: '1', max: '3', step: '0.01', value: '1', 'aria-label': 'Zoom' });
    z.oninput = () => {
      const cx = (SZ / 2 - x) / sc, cy = (SZ / 2 - y) / sc;
      sc = min * (+z.value);
      x = SZ / 2 - cx * sc;
      y = SZ / 2 - cy * sc;
      place();
    };
    sheet(
      el('b', {}, 'Frame your photo'),
      box,
      el('small', { style: 'text-align:center' }, 'Drag to move, use the slider to zoom'),
      z,
      el('div', { class: 'wp ac2' },
        btn('Save photo', () => {
          const c = document.createElement('canvas');
          c.width = c.height = 512;
          c.getContext('2d').drawImage(im, -x / sc, -y / sc, SZ / sc, SZ / sc, 0, 0, 512, 512);
          closeSheet(() => done(c.toDataURL('image/jpeg', .88)));
        }),
        btn('Cancel', () => closeSheet(), 1)
      )
    );
  };
  im.src = url;
}

let activeMessageChannel = null;
function subscribeToConversation(conversationId) {
  if (!sb) return;
  if (activeMessageChannel) sb.removeChannel(activeMessageChannel);
  activeMessageChannel = sb.channel('cosmic-chat-' + conversationId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + conversationId }, payload => {
      const c = find(conversationId);
      if (!c || !payload.new) return;
      const message = mapDbMessage(payload.new);
      if (c.msgs.some(m => m.id === message.id)) return;
      c.msgs.push(message);
      c.msgs.sort((a, b) => a.t - b.t);
      if (cur === conversationId) msgs(true);
      render();
    })
    .subscribe(status => { if (status === 'CHANNEL_ERROR') console.warn('Realtime subscription failed for', conversationId); });
}

  return df <= 0 ? T('Today') : df === 1 ? T('Yesterday') : df < 7 ? d.toLocaleDateString(loc(), { weekday: 'long' }) : fmtDate(d);

const isPureEmoji = str => {
  if (!str) return false;
  const clean = str.replace(/[\uFE00-\uFE0F\u200D]/g, '').trim();
  if (!clean || [...clean].length > 3) return false;
  const emojiRegex = /^(?:[\u{1F300}-\u{1F5FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F1E6}-\u{1F1FF}])+/u;
  const chars = [...clean];
  return chars.every(ch => emojiRegex.test(ch) || /^[\u231a-\u231b\u23e9-\u23ec\u23f3\u25aa-\u25ab\u25b6\u25c0\u25fb-\u25fe\u2600-\u27ef\u2b05-\u2b07\u2b1b-\u2b1c\u2b50\u2b55\u3030\u303d\u3297\u3299]+$/u.test(ch));
};

async function send(extra = {}) {
  const c = cur != null ? find(cur) : null;
  const body = $('#txt').value.trim();
  if (!c || !body) return;
  if (!sb || !activeUserId) return toast('Please sign in again to send messages.');
  const sendButton = $('#send');
  sendButton.disabled = true;
  try {
    const payload = { conversation_id: c.id, sender_id: activeUserId, body, message_type: 'text' };
    const { data, error } = await sb.from('messages')
      .insert(payload)
      .select('id, conversation_id, sender_id, body, message_type, created_at, edited_at, deleted_at')
      .single();
    if (error) throw error;
    const message = mapDbMessage(data);
    if (!c.msgs.some(m => m.id === message.id)) c.msgs.push(message);
    c.msgs.sort((a, b) => a.t - b.t);
    c.draft = '';
    $('#txt').value = '';
    $('#txt').style.height = 'auto';
    msgs(true);
    render();
    haptic('send');
  } catch (e) {
    console.error('Message send failed:', e);
    toast(e.message || 'Message could not be sent.');
  } finally {
    sendButton.disabled = false;
    syncAct();
  }
}

function shrink(f, max, cb, useQ) {
  const qp = useQ ? ({ HD: [2048, .9], 'Data Saver': [720, .5] }[ST.imgQuality] || [max, .72]) : [max, .72];
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, qp[0] / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k);
    c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(im.src);
    cb(c.toDataURL('image/jpeg', qp[1]));
  };
  im.src = URL.createObjectURL(f);
}

  const vis = () => { if (document.hidden) left = true; };
  document.addEventListener('visibilitychange', vis);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);
  const a = el('a', { href: UPI_LINK, style: 'display:none' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => {
    document.removeEventListener('visibilitychange', vis);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
    if (!left) { haptic('warn'); toast('No UPI app found on this device. Scan the QR with your phone or copy the UPI ID.'); }
  }, 2200);
}

const setVal = txt => el('span', { class: 'set-val' }, txt ? el('span', {}, txt) : null, el('span', { class: 'set-chev' }, '›'));
const swRaw = (iconEl, titleTxt, subTxt, val, onChange) => {
  const s = sw(val, onChange);
  const r = row(iconEl, titleTxt, subTxt, s);
  r.setAttribute('role', 'button');
  r.tabIndex = 0;
  r.addEventListener('click', e => { if (!e.target.closest('.sw')) s.click(); });
  r.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target === r) { e.preventDefault(); s.click(); }
  });
  return r;
};
const setSwRow = (iconEl, titleTxt, subTxt, val, onChange) =>
  swRaw(iconEl, titleTxt, subTxt, val, v => { onChange(v); saveST(); applyRuntimeSettings(); });

function choiceSheet(titleTxt, options, currentVal, onSelect) {
  sheet(
    el('b', {}, titleTxt),
    ...options.map(opt => {
      const val = typeof opt === 'object' ? opt.v : opt;
      const lbl = typeof opt === 'object' ? opt.l : opt;
      const sub = typeof opt === 'object' ? (opt.s || '') : '';
      const on = val === currentVal;
      return row(
        el('span', { class: 'set-radio' + (on ? ' on' : '') }),
        lbl,
        sub,
        null,
        () => {
          onSelect(val);
          saveST();
          applyRuntimeSettings();
          closeSheet(() => haptic('pop'));
        },
        true
      );
    })
  );
}

function exportChatsJSON() {
  const payload = {
    app: 'Cosmic Chat',
    exportedAt: new Date().toISOString(),
    profile: { name: P.name, username: P.user || 'cosmic_you', bio: P.bio },
    settings: ST,
    chats: [...C, ...K.filter(k => k.joined)].map(c => ({
      id: c.id,
      title: title(c),
      type: c.k ? 'community' : c.g ? 'group' : c.self ? 'self' : 'direct',
      messages: c.msgs.filter(m => !m.del).map(m => ({
        from: m.f === 'me' ? 'You' : (U[m.f] ? U[m.f].n : m.f),
        text: m.b || (m.doc ? '[Document: ' + m.doc.name + ']' : m.stk || (m.img ? '[Photo]' : '[Attachment]')),
        time: new Date(m.t).toISOString()
      }))
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'cosmic-chat-export-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  haptic('success');
  toast('Chat backup exported (.json)');
}

GALLERY.sort((a, b) => ['Doodle', 'Flow', 'Nature', 'Simple'].indexOf(a[0]) - ['Doodle', 'Flow', 'Nature', 'Simple'].indexOf(b[0]));

function clearOverrides() {
  PR.per = {};
  [...C, ...K].forEach(c => { c.theme = null; });
}

function applyTheme(t) {
  const v = { tid: t.id, wall: t.wall || null, me: t.me || null, art: t.art || 'none', pc: t.pc || null, po: t.po != null ? t.po : null };
  if (SC != null) {
    const c = find(SC);
    c.theme = Object.assign({}, v);
    PR.per[SC] = c.theme;
  } else {
    clearOverrides();
    Object.assign(PR, v);
  }
  applyPrefs();
  refreshArt();
}

      el('section', { class: 'thm-sec' }, el('h3', {}, 'Fine-tune'),
        el('div', { class: 'thm-tune' },

          el('input', { class: 'rng', type: 'range', min: 8, max: 70, value: Math.round((tg().po != null ? tg().po : .28) * 100), 'aria-label': 'Pattern strength', oninput: e => setT('po', e.target.value / 100) }),
          el('small', {}, 'My message colour'),
          swatches([null, '#0f5a52', '#3b2f73', '#6b2338', '#1f4d2e', '#33414f', '#1d5fae', '#7a3a20'], tg().me, c => setT('me', c))))));
  document.body.append(m);

$('#menu').onclick = () => {

  const m = sheet(
    el('b', {}, 'More'),
    row(ic('compose'), 'New group or community', '', null, () => { m.remove(); create(); }),

let mode = 'in';
$('#toggle').onclick = () => {
  haptic('soft');
  mode = mode === 'in' ? 'up' : 'in';
  $('#afold').classList.toggle('open', mode === 'up');
  $('#afold').inert = mode === 'in';
  $('#afold2').classList.toggle('open', mode === 'up');
  $('#afold2').inert = mode === 'in';
  $('#pw2').value = '';
  pwCheck();
  $('#email').placeholder = 'Email address';
  $('#pw').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
  if (mode === 'up') {
    aCheck();
    $('#auth').scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('#go').textContent = mode === 'in' ? 'Sign in' : 'Create account';
  $('#toggle').textContent = mode === 'in' ? 'New here? Create an account' : 'Have an account? Sign in';
};

const unOk = v => /^[a-z][a-z0-9_]{2,19}$/.test(v);
const unClean = v => v.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
const unSug = n => {
  const b = n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 16);
  return !b ? '' : /^[a-z]/.test(b) ? b : 'u_' + b;
};

let AUOK = false, aut;
function aCheck() {
  const v = unClean($('#auser').value), st = $('#aust');
  AUOK = false;
  clearTimeout(aut);
  if (!v) { st.textContent = ''; st.className = 'ust'; return; }
  if (!unOk(v)) {
    st.textContent = 'Use 3 to 20 letters, numbers or underscores. Start with a letter.';
    st.className = 'ust bad';
    return;
  }
  st.textContent = 'Format valid. Username availability will be checked by Supabase.';
  st.className = 'ust';
  AUOK = true;
}

$('#auser').oninput = e => {
  if (e.isComposing) return;
  $('#auser').dataset.t = 1;
  const cleaned = $('#auser').value.toLowerCase().replace(/[^a-z0-9_]/g, '');
  if ($('#auser').value !== cleaned) $('#auser').value = cleaned;
  aCheck();
};

$('#name').oninput = e => {
  if (e.isComposing) return;
  if (!$('#auser').dataset.t) {
    const sug = unSug($('#name').value);
    if ($('#auser').value !== sug) $('#auser').value = sug;
    aCheck();
  }
};

const enter = () => {
  haptic('success');
  $('#auth').hidden = true;
  $('#app').hidden = false;
  if (location.hash) location.replace('#');
  render();
  fit();
  if (LOCK) showLock('unlock');
};

async function signOut() {
  try {
    if (sb) {
      const { error } = await sb.auth.signOut();
      if (error) throw error;
    }
    document.querySelectorAll('.modal').forEach(m => m.remove());
    C = []; K = []; Object.keys(U).forEach(k => { if (k !== 'me') delete U[k]; }); F = new Set(); R = []; S = new Set();
    P = { name: 'Cosmicpioneer', bio: 'Building things under the stars.' };
    $('#app').hidden = true;
    $('#auth').hidden = false;
    closeConv();
    if (location.hash) location.replace('#');
    if (mode === 'up') $('#toggle').click();
    $('#pw').value = '';
    $('#pw2').value = '';
    toast('Signed out securely.');
  } catch (e) {
    console.error('Sign out failed:', e);
    toast(e.message || 'Could not sign out. Please try again.');
  }
}

async function submit(kind) {
  const go = $('#go'), g = $('#google');
  if (go.disabled) return;
  if (!sb) return toast('Supabase configuration is missing. Check config.js.');
  const email = $('#email').value.trim().toLowerCase();
  const password = $('#pw').value;
  if (kind === 'new') {
    const bad = !$('#name').value.trim() ? 'Enter your name.'
      : !/^[a-z][a-z0-9_]{2,19}$/.test(String($('#auser').value || '').trim().toLowerCase().replace(/^@/, '')) ? 'Username must be 3–20 characters, start with a letter, and contain only letters, numbers or underscores.' 
      : !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Enter a valid email address.'
      : password.length < 8 ? 'Use a password with at least 8 characters.'
      : password !== $('#pw2').value ? 'Passwords do not match.' : '';
    if (bad) return toast(bad);
  } else if (kind === 'old') {
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter your email address.');
    if (!password) return toast('Enter your password.');
  }
  go.disabled = true; g.disabled = true;
  const oldLabel = go.textContent;
  go.textContent = kind === 'new' ? 'Creating account…' : 'Signing in…';
  try {
    if (kind === 'google') {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) throw error;
      return;
    }
    if (kind === 'new') {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: {
          data: { full_name: $('#name').value.trim(), username: String($('#auser').value || '').trim().toLowerCase().replace(/^@/, '') },
          emailRedirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) throw error;
      if (data.session) {
        await activateSession(data.session);
      } else {
        toast('Account created. Check your email to verify your address, then sign in.');
        mode = 'in';
        $('#toggle').click();
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await activateSession(data.session);
    }
  } catch (e) {
    console.error('Authentication failed:', e);
    const msg = (e && e.message) || 'Authentication failed. Please try again.';
    if (/username|profiles_username_key|duplicate key/i.test(msg)) toast('That username is already taken. Choose another.');
    else if (/invalid login credentials/i.test(msg)) toast('Incorrect email or password.');
    else if (/email not confirmed/i.test(msg)) toast('Please verify your email before signing in.');
    else toast(msg);
  } finally {
    go.disabled = false; g.disabled = false; go.textContent = oldLabel;
  }
}

$('#go').onclick = () => submit(mode === 'up' ? 'new' : 'old');
$('#google').onclick = () => submit('google');
$('#forgot').onclick = async () => {
  if (!sb) return toast('Supabase configuration is missing.');
  const email = $('#email').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter your email address first.');
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if (error) throw error;
    toast('If an account exists for this email, a password reset link has been sent.');
  } catch (e) { toast(e.message || 'Could not request a password reset.'); }
};
function pwCheck() {
  const a = $('#pw').value, b = $('#pw2').value, st = $('#pwst');
  if (!b) { st.textContent = ''; st.className = 'ust'; return; }
  const same = a === b;
  st.textContent = same ? 'Passwords match.' : 'Passwords do not match.';
  st.className = 'ust ' + (same ? 'good' : 'bad');
}
$('#pw').addEventListener('input', pwCheck);
$('#pw2').addEventListener('input', pwCheck);
$('#pwt').onclick = () => {
  haptic('soft');
  const p = $('#pw'), sh = p.type === 'password';
  p.type = $('#pw2').type = sh ? 'text' : 'password';
  $('#pwt').textContent = sh ? 'Hide' : 'Show';
  $('#pwt').setAttribute('aria-label', sh ? 'Hide password' : 'Show password');
};
$('#auth').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#go').click();
});
$('#send').onpointerdown = e => e.preventDefault();

const vv = window.visualViewport;
function revealAuthField(elTarget) {
  if (!elTarget || elTarget.tagName !== 'INPUT') return;
  const authBox = elTarget.closest('.auth');
  if (!authBox) return;
  if (elTarget.id === 'name') {
    authBox.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    elTarget.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
function syncFit() {
  fit();
  requestAnimationFrame(fit);
  setTimeout(fit, 80);
  setTimeout(fit, 200);
  setTimeout(fit, 360);
}

document.addEventListener('focusin', e => {
  if (e.target && e.target.closest('.auth')) {
    setTimeout(() => revealAuthField(e.target), 120);
  }
  syncFit();
});
document.addEventListener('focusout', syncFit);

function fit() {
  const winH = window.innerHeight;
  const vvH = vv ? vv.height : winH;
  const vvTop = vv ? vv.offsetTop : 0;
  const useVv = vv && (winH - vvH > 80);
  const hCss = useVv ? vvH + 'px' : '100%';
  const tfCss = (useVv && vvTop) ? 'translateY(' + vvTop + 'px)' : '';
  if (window.scrollY || window.scrollX) window.scrollTo(0, 0);

  const active = document.activeElement;
  const scrH = window.screen ? window.screen.height : winH;
  const effH = useVv ? vvH : winH;
  const kbOpen = !!(active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && !/^(file|checkbox|radio|range|button|submit)$/i.test(active.type)))) || effH < scrH * 0.72;

  document.querySelectorAll('.auth').forEach(authEl => {
    if (authEl.hidden) return;
    if (useVv) {
      authEl.style.height = vvH + 'px';
      authEl.style.bottom = 'auto';
      authEl.style.transform = tfCss;
    } else {
      authEl.style.removeProperty('height');
      authEl.style.removeProperty('bottom');
      authEl.style.removeProperty('transform');
    }
  });

  if (active && active.closest('.auth')) {
    revealAuthField(active);
    return;
  }

  if ($('#app').hidden) return;
  const a = $('#app');
  a.classList.toggle('kb', kbOpen);
  a.style.height = hCss;
  a.style.transform = tfCss;
  if (cur !== null) {
    const p = $('#msgs');
    if (active === $('#txt') || p.scrollHeight - p.scrollTop - p.clientHeight < 220) {
      p.scrollTop = p.scrollHeight;
    }
  }
}
document.addEventListener('selectstart', e => {
  if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
    e.preventDefault();
  }
});
document.addEventListener('contextmenu', e => {
  if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
    e.preventDefault();
  }
});

if (vv) {
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
addEventListener('resize', fit);
// Load the signed-in user's profile from the database before opening the app.
let activeUserId = null;
async function activateSession(session) {
  if (!session || !session.user || !sb) return;
  if (activeUserId === session.user.id && !$('#app').hidden) return;
  activeUserId = session.user.id;
  try {
    let { data: profile, error } = await sb.from('profiles')
      .select('id, username, display_name, avatar_url, bio')
      .eq('id', session.user.id).maybeSingle();
    if (error) throw error;
    if (!profile) {
      const meta = session.user.user_metadata || {};
      const payload = {
        id: session.user.id,
        username: unClean(meta.username || ('user_' + session.user.id.slice(0, 8))),
        display_name: (meta.full_name || session.user.email || 'Cosmic User').toString().slice(0, 80)
      };
      const created = await sb.from('profiles').upsert(payload, { onConflict: 'id' })
        .select('id, username, display_name, avatar_url, bio').single();
      if (created.error) throw created.error;
      profile = created.data;
    }
    P = {
      ...P, name: profile.display_name || session.user.email || 'Cosmic User',
      username: profile.username || '', img: profile.avatar_url || '',
      bio: profile.bio || ''
    };
    U.me = { n: P.name, username: P.username, img: P.img, on: true };
    enter();
    await loadConversations();
  } catch (e) {
    console.error('Profile bootstrap failed:', e);
    activeUserId = null;
    toast('Signed in, but your profile could not load. Check that the Cosmic Chat SQL setup has been run.');
  }
}

if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    if (session) setTimeout(() => activateSession(session), 0);
    else if (event === 'SIGNED_OUT') {
      activeUserId = null;
      $('#app').hidden = true;
      $('#auth').hidden = false;
    }
  });
  sb.auth.getSession().then(({ data, error }) => {
    if (error) console.error('Session restore failed:', error);
    if (data && data.session) activateSession(data.session);
  });
}

applyRuntimeSettings();
fit();
