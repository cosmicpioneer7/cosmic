<style>

@media(min-width:900px){#brand{left:28px;top:calc(env(safe-area-inset-top,0px) + 22px);font-size:15px}#sim{right:28px;top:calc(env(safe-area-inset-top,0px) + 22px);font-size:13px}#card{left:28px;top:calc(env(safe-area-inset-top,0px) + 60px);max-width:360px}}

button{transition:background .25s,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s,color .3s}
